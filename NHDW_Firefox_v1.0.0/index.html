<!DOCTYPE html>
<html id="htmlLight">
    <head>
        <meta charset="utf-8"/>
        <!-- Mobile viewport: on Firefox for Android the action popup opens in
             a full tab; without this the page renders zoomed-out and wide.
             Harmless on desktop, where the popup keeps its fixed 500px width. -->
        <meta name="viewport" content="width=device-width, initial-scale=1"/>
        <link rel="stylesheet" type="text/css" href="css/style.css"/>
        <script src="js/preview.js"></script>
    </head>
    <body>
        <!-- Popup tabs: Download (everything the popup renders today) and
             Settings (API key + file-name template, editable on the fly). -->
        <div id="popupTabs" class="popupTabs">
            <button id="tabDownload" class="popupTab active" type="button">Download</button>
            <button id="tabSettings" class="popupTab" type="button">Settings</button>
        </div>
        <div id="action">Loading...</div>
        <div id="settingsPane" hidden></div>
        <!-- Base host-grant notice: Firefox MV3 does not grant host_permissions
             at install time, so on first run the popup offers a one-tap grant
             for the nhentai hosts (see preview.ts refreshHostNotice). -->
        <div id="hostNotice" class="cdnNotice" hidden></div>
        <!-- CDN host-grant notice (hidden unless nhentai reports image hosts the
             extension has no host permission for; see preview.ts refreshCdnNotice). -->
        <div id="cdnNotice" class="cdnNotice" hidden></div>
    </body>
</html>
